# DIY Supplement Dispenser – default configuration (Phase 1)
# Override path with DISPENSER_CONFIG or --config
#
# GPIO map: DT=5 SCK=6 STEP=12 DIR=13 EN=16 VIBE=17 PUMP=27 FLOW=22 LEVEL=23 CUP=24 ESTOP=25

hardware:
  # "sim" | "pi" — also forced to sim when DISPENSER_SIM=1
  mode: sim

  scale:
    dt_pin: 5
    sck_pin: 6
    # grams per raw unit (calibrated on hardware)
    scale_factor: 1.0
    # number of samples to average for a stable reading
    samples: 5
    # simulated noise amplitude (grams) when in sim mode
    sim_noise_g: 0.02

  stepper:
    step_pin: 12
    dir_pin: 13
    en_pin: 16
    # steps per second while dosing
    steps_per_sec: 800
    # reverse direction high/low (board wiring)
    reverse: false
    # enable pin active-low (typical TMC / A4988)
    enable_active_low: true

  vibration:
    pin: 17
    # duty cycle 0–100 for PWM vibration assist
    duty_percent: 80

  pump:
    pin: 27
    # calibrated flow rate used for timed water dosing
    ml_per_second: 25.0

  sensors:
    flow_pin: 22
    level_pin: 23
    cup_pin: 24
    estop_pin: 25
    # whether cup present sensor is active-high
    cup_active_high: true
    # True when water is present (adjust for your float switch polarity)
    level_active_high: true
    # E-stop: NC to GND with pull-up; active-low when pressed
    estop_active_low: true
    # Set false to disable optional sensors (None at runtime)
    cup_enabled: true
    level_enabled: true
    estop_enabled: true

dosing:
  powder:
    # stop bursts when within this many grams of target
    approach_band_g: 0.15
    # absolute success tolerance after settle
    tolerance_g: 0.10
    # short burst duration (seconds)
    burst_seconds: 0.12
    # pause between bursts for scale settle
    settle_seconds: 0.25
    # final settle before verification
    final_settle_seconds: 0.6
    # overall timeout for a single powder dose
    timeout_seconds: 45.0
    # if weight does not increase by this over window → jam
    jam_min_progress_g: 0.05
    jam_window_seconds: 3.0
    # reverse-auger duration on jam
    jam_reverse_seconds: 0.4
    max_jam_retries: 2
    # best-effort overshoot reverse (may not remove powder from cup)
    overshoot_reverse_seconds: 0.08
    max_overshoot_reverses: 3
    # sim: grams dispensed per second of auger run (approx)
    sim_grams_per_second: 2.5

  water:
    # safety timeout multiplier on expected time
    timeout_factor: 1.5
    # reserved for future closed-loop flow path; Phase 1 is open-loop timed
    tolerance_ml: 5.0
    # sim flow rate (ml/s) if not using calibrated pump rate
    sim_ml_per_second: 25.0

  cycle:
    # delay after powders+water for optional mix (seconds)
    mix_delay_seconds: 1.0
    require_cup: true

database:
  # relative to software/ or absolute path
  path: data/dispenser.db

api:
  # Bind localhost by default (override with --host or api.host for LAN)
  host: "127.0.0.1"
  port: 8000
  # Optional API token for mutating routes (POST /dispense, POST /recipes).
  # Empty = disabled. Override with env DISPENSER_API_TOKEN.
  token: ""

logging:
  level: INFO
