<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Two-tier countertop supplement carousel concept</title>
<desc id="desc">A front illustration of two rotating tiers with removable cartridges, and a top view showing five cartridges around a central hub. This is a concept, not an engineered design.</desc>
<rect width="1100" height="600" fill="#f5f2eb"/>
<text x="55" y="55" fill="#202c2b" font-family="Arial,sans-serif" font-size="30" font-weight="bold">THE COUNTERTOP CAROUSEL</text>
<text x="55" y="83" fill="#60716c" font-family="Arial,sans-serif" font-size="16">Two independent tiers · Ten removable cartridges · Manual dosing with a scale</text>
<g transform="translate(85 120)">
