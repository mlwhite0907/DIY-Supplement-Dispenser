 <g fill="#283331"><circle cx="93" cy="129" r="17"/><circle cx="190" cy="129" r="17"/><circle cx="287" cy="129" r="17"/><circle cx="93" cy="310" r="17"/><circle cx="190" cy="310" r="17"/><circle cx="287" cy="310" r="17"/></g>
