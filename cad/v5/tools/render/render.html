<!--
  Dose Bar photo renderer (three.js r169, driven by render.mjs in headless Chromium).

  Look: a warm studio sweep, one large soft key (an area light sampled over many
  frames), a sky dome that also casts shadows (so creases and the ground get
  ambient occlusion), a weak fill and a rim, and a room environment for
  reflections. Frames are jittered and averaged in a float buffer (soft shadows
  and anti-aliasing), tone mapped once (AgX by default) and composited over the
  backdrop, which is not tone mapped, so the background colour is exact.

  Scene JSON (OpenSCAD coordinates: Z up, mm). Every key is optional except parts.
  {
    "width": 1600, "height": 1200, "samples": 48,
    "toneMapping": "agx" | "aces" | "neutral" | "linear", "exposure": 1.0,
    "background": {"top": "#F4F1EB", "bottom": "#E3DED5", "vignette": 0.10, "glow": [0.5, 0.42]},
    "env": 0.35,
    "key":  {"dir": [-0.55, 0.75, 0.55], "space": "camera", "intensity": 2.4, "color": "#FFF6EC", "soft": 0.16},
    "dome": {"intensity": 0.9, "color": "#F3F6FF", "minElevation": 18},
    "fill": {"dir": [0.9, 0.1, 0.6], "space": "camera", "intensity": 0.35},
    "rim":  {"dir": [0.2, 0.6, -1.0], "space": "camera", "intensity": 0.9},
    "ground": {"z": null, "shadow": 0.5},
    "creaseAngle": 32,
    "parts": [{"file": "assets/x.stl", "kind": "plastic"|"rubber"|"glass"|"powder",
               "color": "#ECE8DF", "rough": 0.5, "pos": [0,0,0], "rot": [0,0,0], "tag": "dial", "shadow": true}],
    "camera": {"dir": [-0.8, -1.2, 0.7], "fov": 26, "fill": 0.82, "tags": ["dial"], "shift": [0, 0],
               "pos": null, "target": null}
  }
  "space": "camera" means dir = [right, up, toward camera]; "world" means OpenSCAD x, y, z.
  camera.dir points from the subject to the camera; the distance is solved so the
  subject (all parts, or only parts whose tag is in camera.tags) fills `fill` of
  the frame. camera.pos + camera.target override the solver.
  The older format (top-level fov, key/fill/rim as numbers, background as one
  colour, envIntensity, shadowOpacity, part.glass, part.opacity) still works.
-->
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const t0 = performance.now();
const log = (...a) => console.log('[render]', ((performance.now() - t0) / 1000).toFixed(1) + 's', ...a);
try {
const params = new URLSearchParams(location.search);
const cfg = await (await fetch(params.get('scene'))).json();
// ---- backward compatibility with the first scene format
const num = (v) => typeof v === 'number';
if (num(cfg.key)) cfg.key = { intensity: cfg.key };
if (num(cfg.fill)) cfg.fill = { intensity: cfg.fill };
if (num(cfg.rim)) cfg.rim = { intensity: cfg.rim };
if (typeof cfg.background === 'string') cfg.background = { top: cfg.background, bottom: cfg.background, vignette: 0 };
if (cfg.envIntensity != null && cfg.env == null) cfg.env = cfg.envIntensity;
if (cfg.shadowOpacity != null && cfg.ground !== false) cfg.ground = { ...(cfg.ground || {}), shadow: cfg.shadowOpacity };
cfg.camera = cfg.camera || {};
if (cfg.fov != null && cfg.camera.fov == null) cfg.camera.fov = cfg.fov;

const W = cfg.width || 1600, H = cfg.height || 1200;
const N = Math.max(1, +(params.get('samples') || cfg.samples || 32));

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = { aces: THREE.ACESFilmicToneMapping, agx: THREE.AgXToneMapping, neutral: THREE.NeutralToneMapping,
                         linear: THREE.LinearToneMapping }[cfg.toneMapping || 'agx'] ?? THREE.AgXToneMapping;
renderer.toneMappingExposure = cfg.exposure ?? 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = cfg.env ?? 0.35;
const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);   // OpenSCAD Z-up -> three Y-up
const z2y = v => new THREE.Vector3(v[0], v[2], -v[1]);

// ---------------------------------------------------------------- materials
function material(p) {
  const kind = p.kind || (p.glass ? 'glass' : 'plastic');
  const color = new THREE.Color(p.color || '#dddddd');
  if (kind === 'glass') return new THREE.MeshPhysicalMaterial({
    color: p.color || '#ffffff', metalness: 0, roughness: p.rough ?? 0.04, transmission: 1, thickness: p.thickness ?? 3,
    ior: 1.5, attenuationColor: new THREE.Color(p.tint || '#d6e9e1'), attenuationDistance: p.attenuation ?? 220,
    specularIntensity: 1, envMapIntensity: p.env ?? 1.4, side: THREE.DoubleSide });
  const opacity = p.opacity ?? 1, transparent = opacity < 1;
  if (kind === 'powder') return new THREE.MeshPhysicalMaterial({ color, roughness: p.rough ?? 0.95, metalness: 0,
    specularIntensity: 0.2, sheen: 0.4, sheenRoughness: 0.9, sheenColor: new THREE.Color('#ffffff') });
  if (kind === 'rubber') return new THREE.MeshPhysicalMaterial({ color, roughness: p.rough ?? 0.82, metalness: 0,
    specularIntensity: 0.35, sheen: 0.15, sheenRoughness: 0.7, transparent, opacity });
  // PLA: satin plastic, slight sheen so grazing light rolls off softly
  return new THREE.MeshPhysicalMaterial({ color, roughness: p.rough ?? 0.5, metalness: p.metal ?? 0,
    specularIntensity: p.spec ?? 0.55, sheen: p.sheen ?? 0.12, sheenRoughness: 0.6,
    sheenColor: new THREE.Color('#ffffff'), envMapIntensity: p.env ?? 1.0, transparent, opacity });
}

// ---------------------------------------------------------------- load parts
const loader = new STLLoader();
const crease = (cfg.creaseAngle ?? 32) * Math.PI / 180;
const meshes = [];
await Promise.all((cfg.parts || []).map(async (p, idx) => {
  let geo;
  try { geo = await new Promise((res, rej) => loader.load(p.file, res, undefined, rej)); }
  catch (e) { log('missing', p.file); return; }
  if (!geo.attributes.position || geo.attributes.position.count === 0) return;
  geo.deleteAttribute('normal');
  geo = toCreasedNormals(geo, p.crease != null ? p.crease * Math.PI / 180 : crease);
  const mesh = new THREE.Mesh(geo, material(p));
  const glass = (p.kind === 'glass' || p.glass);
  mesh.castShadow = !glass && (p.shadow ?? true);
  mesh.receiveShadow = !glass;
  mesh.userData = { tag: p.tag || null, order: idx };
  const g = new THREE.Group(); g.add(mesh);
  if (p.pos) g.position.set(...p.pos);
  if (p.rot) g.rotation.set(...p.rot.map(d => d * Math.PI / 180));
  world.add(g); meshes.push(mesh);
}));
world.updateMatrixWorld(true);
if (!meshes.length) throw new Error('no parts loaded');

const box = new THREE.Box3();
for (const m of meshes) box.expandByObject(m);
const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
const R = size.length() * 0.5;
log(`${meshes.length} meshes, scene radius ${R.toFixed(0)} mm`);

// ---------------------------------------------------------------- camera
const fov = cfg.camera.fov ?? 26;
let cam;
if (cfg.camera.ortho || cfg.ortho) {
  const o = cfg.camera.ortho || cfg.ortho;
  cam = new THREE.OrthographicCamera(-o * W / H, o * W / H, o, -o, 1, 1e5);
} else cam = new THREE.PerspectiveCamera(fov, W / H, 1, 1e5);
function subjectPoints() {
  const tags = cfg.camera.tags;
  let sel = (tags && tags.length) ? meshes.filter(m => tags.includes(m.userData.tag)) : meshes;
  if (!sel.length) sel = meshes;
  const pts = [], v = new THREE.Vector3();
  for (const m of sel) {
    const pos = m.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 40000));
    for (let i = 0; i < pos.count; i += step) pts.push(v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld).clone());
  }
  return pts;
}
if (cfg.camera.pos && cfg.camera.target) {
  cam.position.copy(z2y(cfg.camera.pos)); cam.up.set(0, 1, 0); cam.lookAt(z2y(cfg.camera.target));
} else if (cam.isPerspectiveCamera) {
  const pts = subjectPoints();
  const sb = new THREE.Box3().setFromPoints(pts);
  const target = cfg.camera.target ? z2y(cfg.camera.target) : sb.getCenter(new THREE.Vector3());
  const dir = z2y(cfg.camera.dir || [-0.8, -1.2, 0.7]).normalize();
  const fill = cfg.camera.fill ?? 0.82;
  const shift = cfg.camera.shift || [0, 0];                // where the subject centre sits, in NDC
  const extents = (dist) => {
    cam.position.copy(target).addScaledVector(dir, dist); cam.up.set(0, 1, 0); cam.lookAt(target);
    cam.updateMatrixWorld(true); cam.updateProjectionMatrix();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; const q = new THREE.Vector3();
    for (const p of pts) { q.copy(p).project(cam); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
    return { x0, x1, y0, y1 };
  };
  let dist = sb.getSize(new THREE.Vector3()).length() / Math.tan(fov * Math.PI / 360);
  for (let it = 0; it < 8; it++) {
    let e = extents(dist);
    dist *= Math.max(e.x1 - e.x0, e.y1 - e.y0) / (2 * fill);
    e = extents(dist);
    const cx = (e.x0 + e.x1) / 2 - shift[0], cy = (e.y0 + e.y1) / 2 - shift[1];
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    const halfH = Math.tan(fov * Math.PI / 360) * dist, halfW = halfH * W / H;
    target.addScaledVector(right, cx * halfW).addScaledVector(up, cy * halfH);
  }
  extents(dist);
} else {
  const dir = z2y(cfg.camera.dir || [-0.8, -1.2, 0.7]).normalize();
  cam.position.copy(center).addScaledVector(dir, R * 4); cam.lookAt(center);
}
cam.near = Math.max(1, cam.position.distanceTo(center) - R * 3); cam.far = cam.position.distanceTo(center) + R * 6;
cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
const camRight = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
const camUp = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
const camBack = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 2);
const dirOf = (spec, dflt) => {
  const d = spec?.dir || dflt;
  if ((spec?.space || 'camera') === 'camera')
    return new THREE.Vector3().addScaledVector(camRight, d[0]).addScaledVector(camUp, d[1]).addScaledVector(camBack, d[2]).normalize();
  return z2y(d).normalize();
};

// ---------------------------------------------------------------- lights
const groundY = cfg.ground?.z != null ? cfg.ground.z : box.min.y;
const L = R * 4;
function shadowLight(color, intensity, extent, mapSize) {
  const l = new THREE.DirectionalLight(color, intensity);
  l.castShadow = true; l.shadow.mapSize.set(mapSize, mapSize);
  Object.assign(l.shadow.camera, { left: -extent, right: extent, top: extent, bottom: -extent, near: L - R * 3, far: L + R * 3 });
  l.shadow.camera.updateProjectionMatrix();
  l.shadow.bias = -0.0003; l.shadow.normalBias = Math.max(0.15, extent * 2 / mapSize * 1.5);
  l.target.position.copy(center); scene.add(l, l.target);
  return l;
}
const keyCfg = cfg.key || {};
const keyDir = dirOf(keyCfg, [-0.55, 0.75, 0.55]);
const key = shadowLight(keyCfg.color || '#FFF6EC', keyCfg.intensity ?? 2.4, R * 1.15, cfg.shadowMap || 2048);
const domeCfg = cfg.dome || {};
const dome = (domeCfg.intensity ?? 0.9) > 0 ? shadowLight(domeCfg.color || '#F3F6FF', domeCfg.intensity ?? 0.9, R * 2.2, cfg.shadowMap || 2048) : null;
for (const [name, dflt, inten, col] of [['fill', [0.9, 0.1, 0.6], 0.35, '#FFF1E2'], ['rim', [0.2, 0.6, -1.0], 0.9, '#F2F5FF']]) {
  const c = cfg[name] || {};
  if ((c.intensity ?? inten) <= 0) continue;
  const l = new THREE.DirectionalLight(c.color || col, c.intensity ?? inten);
  l.position.copy(center).addScaledVector(dirOf(c, dflt), L); l.target.position.copy(center); scene.add(l, l.target);
}
if (cfg.hemi) scene.add(new THREE.HemisphereLight('#ffffff', '#d8d2c8', cfg.hemi));

// shadow-catcher ground: invisible, only darkens the backdrop where shadowed
const ground = new THREE.Mesh(new THREE.PlaneGeometry(R * 40, R * 40),
  new THREE.ShadowMaterial({ color: new THREE.Color(cfg.ground?.color || '#2a2118'), opacity: cfg.ground?.shadow ?? 0.5 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(center.x, groundY - 0.02, center.z);
ground.receiveShadow = true;
if (cfg.ground !== false) scene.add(ground);

// ---------------------------------------------------------------- accumulation buffers
const rtOpts = { type: THREE.FloatType, format: THREE.RGBAFormat, colorSpace: THREE.LinearSRGBColorSpace,
                 minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false };
const frameRT = new THREE.WebGLRenderTarget(W, H, rtOpts);
const accRT = new THREE.WebGLRenderTarget(W, H, { ...rtOpts, depthBuffer: false });
const quadGeo = new THREE.PlaneGeometry(2, 2);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const vs = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const accMat = new THREE.ShaderMaterial({ uniforms: { tex: { value: frameRT.texture } }, vertexShader: vs,
  fragmentShader: 'uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tex, vUv); }',
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor, depthTest: false, depthWrite: false, toneMapped: false });
const accScene = new THREE.Scene(); accScene.add(new THREE.Mesh(quadGeo, accMat));

const bg = cfg.background || {};
const finalMat = new THREE.ShaderMaterial({
  uniforms: { acc: { value: accRT.texture }, invN: { value: 1 / N }, top: { value: new THREE.Color(bg.top || '#F4F1EB') },
    bottom: { value: new THREE.Color(bg.bottom || '#E3DED5') }, vignette: { value: bg.vignette ?? 0.10 },
    glow: { value: new THREE.Vector2(...(bg.glow || [0.5, 0.42])) }, glowAmt: { value: bg.glowAmount ?? 0.06 },
    aspect: { value: W / H }, seed: { value: 0.37 } },
  vertexShader: vs, toneMapped: true, depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D acc; uniform float invN, vignette, aspect, seed, glowAmt; uniform vec3 top, bottom; uniform vec2 glow;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + seed) * 43758.5453); }
    void main(){
      vec4 c = texture2D(acc, vUv) * invN;                    // premultiplied, linear, HDR
      float a = clamp(c.a, 0.0, 1.0);
      vec3 obj = a > 1e-5 ? toneMapping(c.rgb / max(c.a, 1e-5)) : vec3(0.0);
      // studio sweep: vertical gradient, a soft pool of light behind the subject, gentle vignette
      vec3 b = mix(bottom, top, smoothstep(0.0, 1.0, vUv.y));
      vec2 d = (vUv - glow) * vec2(aspect, 1.0);
      b *= 1.0 + glowAmt * exp(-dot(d, d) * 3.0);
      vec2 v = (vUv - 0.5) * vec2(aspect, 1.0);
      b *= 1.0 - vignette * smoothstep(0.35, 1.05, length(v));
      vec3 col = obj * a + b * (1.0 - a);
      gl_FragColor = linearToOutputTexel(vec4(col, 1.0));
      gl_FragColor.rgb += (hash(gl_FragCoord.xy) - 0.5) / 255.0;   // dither: no banding in the sweep
    }` });
const finalScene = new THREE.Scene(); finalScene.add(new THREE.Mesh(quadGeo, finalMat));

// What the transmission pass sees behind glass (a flat colour): the backdrop, slightly darkened.
const glassBg = new THREE.Color(bg.top || '#F4F1EB').lerp(new THREE.Color(bg.bottom || '#E3DED5'), 0.5)
  .multiplyScalar(cfg.glassBackdrop ?? 0.8);

const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
const keyU = new THREE.Vector3().crossVectors(keyDir, Math.abs(keyDir.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0)).normalize();
const keyV = new THREE.Vector3().crossVectors(keyDir, keyU).normalize();
const soft = keyCfg.soft ?? 0.16;                               // angular radius of the softbox (rad)
const minEl = (domeCfg.minElevation ?? 18) * Math.PI / 180;

renderer.setRenderTarget(accRT); renderer.setClearColor(0x000000, 0); renderer.clear();
log(`setup done, ${N} samples at ${W}x${H}`);
for (let i = 0; i < N; i++) {
  const k = i + 1;
  const jx = halton(k, 2) - 0.5, jy = halton(k, 3) - 0.5;          // sub-pixel jitter (anti-aliasing)
  if (cam.isPerspectiveCamera) cam.setViewOffset(W, H, jx, jy, W, H);
  const r = soft * Math.sqrt(halton(k, 5)), th = 2 * Math.PI * halton(k, 7);   // point on the softbox
  const kd = keyDir.clone().addScaledVector(keyU, r * Math.cos(th)).addScaledVector(keyV, r * Math.sin(th)).normalize();
  key.position.copy(center).addScaledVector(kd, L);
  if (dome) {                                                      // one shadowed sky sample per frame
    const st = Math.sqrt(halton(k, 11)) * Math.cos(minEl), ph = 2 * Math.PI * halton(k, 13);
    dome.position.copy(center).addScaledVector(new THREE.Vector3(st * Math.cos(ph), Math.sqrt(1 - st * st), st * Math.sin(ph)), L);
  }
  renderer.setRenderTarget(frameRT);
  renderer.setClearColor(0x000000, 0); renderer.clear();
  renderer.setClearColor(glassBg, 1);            // read by the transmission pass only
  renderer.render(scene, cam);
  renderer.setRenderTarget(accRT);
  renderer.render(accScene, quadCam);
  if (i === 0) log('first frame');
}
cam.clearViewOffset();
renderer.setRenderTarget(null);
renderer.setClearColor(0x000000, 1); renderer.clear();
renderer.render(finalScene, quadCam);
log('done');
window.__ready = true;
} catch (e) { window.__error = String(e && e.stack || e); }
</script></body></html>
